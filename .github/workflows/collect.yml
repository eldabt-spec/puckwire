name: collect

on:
  schedule:
    # Hourly. News and starting goalies are pulled live by the site itself;
    # this job only refreshes slow-moving data: your ESPN roster, line combos, NHL player index.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # lets the job replace the `data` branch

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Load current data from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
          fi

      - name: Collect roster, latest note per rostered player, lines and player index
        run: python collector/collect.py players lines espn roster_notes
        env:
          DATA_DIR: data
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: "1"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_SEASON: "2027"

      - name: Replace the data branch with one fresh commit (history never grows)
        if: always()
        run: |
          cd data
          rm -f news_items.json goalie_starts.json   # the site pulls these live now
          [ -n "$(ls -A)" ] || exit 0
          git init -q -b data
          git config user.name "puckwire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
